name: Build all packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
            - target: linux-64
              os: ubuntu-24.04
              runner: github
            - target: osx-arm64
              runner: [self-hosted, macOS, ARM64]
    runs-on: ${{ matrix.os || matrix.runner }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    #- uses: prefix-dev/setup-pixi@v0.8.8
    #with:
    #    pixi-version: v0.44.0
    #    cache: false
    #    auth-host: prefix.dev
    #    auth-token: ${{ secrets.PREFIX_DEV_TOKEN }} 

    - name: Add .pixi/envs/default to the $PATH
      shell: bash
      run: |
        echo "$(pwd)/.pixi/envs/default/bin" >> $GITHUB_PATH

    - name: Run code in changed subdirectories
      shell: bash
      env:
        TARGET_PLATFORM: ${{ matrix.target }}

      run: |
        # One entry per recipe dir CI is expected to build. --skip-existing=all
        # means an already-published version is a no-op, so listing a dir is
        # cheap once its package is out.
        for recipe in yamet r-rcppml; do
          pixi run rattler-build build --recipe-dir "$recipe" \
            --skip-existing=all --target-platform=$TARGET_PLATFORM \
            --verbose \
            -c conda-forge -c bioconda -c https://prefix.dev/almost-conductor
        done

    - name: Upload all packages
      shell: bash
      # do not upload on PR
      if: github.event_name == 'push'
      #env:
      #  PREFIX_API_KEY: ${{ secrets.PREFIX_DEV_TOKEN }}
      run: |
        # ignore errors because we want to ignore duplicate packages
        for file in output/**/*.conda; do
          pixi run rattler-build upload prefix -c almost-conductor "$file" || true
        done
